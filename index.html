<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BracketFlow | Professional Tournament Manager</title>
    <style>
        /* =========================================
           CONFIGURAÇÕES DE DESIGN (CSS)
           ========================================= */
        :root {
            --bg-deep: #000000;      /* Fundo principal */
            --bg-sidebar: #111111;   /* Fundo lateral */
            --bg-card: #ffffff;      /* Cor das chaves */
            --border: #333333;       /* Cor das bordas e linhas */
            --text-main: #ffffff;    /* Texto claro */
            --text-dark: #000000;    /* Texto escuro para caixas brancas */
            --accent: #888888;       /* Cinza para detalhes */
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR */
        header {
            height: 65px;
            background-color: #000;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
        }

        .logo-container img {
            height: 35px;
            display: block;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .workspace-btn {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .auth-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-white {
            background-color: #fff;
            color: #000;
            border: 1px solid #fff;
        }

        .btn-white:hover {
            background-color: #ccc;
        }

        /* ÁREA DE TRABALHO */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* SIDEBAR DE CONFIGURAÇÃO (PÁGINA 3) */
        #sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-header {
            font-size: 14px;
            font-weight: 900;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        .slots-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .slot-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slot-field label {
            font-size: 9px;
            color: var(--accent);
            font-weight: bold;
        }

        .slot-input {
            background: #222;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            font-size: 12px;
            border-radius: 2px;
            outline: none;
            transition: border-color 0.3s;
        }

        .slot-input:focus {
            border-color: #fff;
        }

        .info-box {
            margin-top: auto;
            background: #000;
            padding: 15px;
            border-left: 4px solid #fff;
            font-size: 11px;
            line-height: 1.6;
            color: var(--accent);
        }

        /* VISUALIZAÇÃO DA BRACKET (ÁREA CINZA/PRETA) */
        #viewport {
            flex: 1;
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle, #222 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 60px;
        }

        .bracket-wrapper {
            display: flex;
            gap: 80px;
            align-items: center;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-height: 600px;
        }

        .match {
            display: flex;
            flex-direction: column;
            position: relative;
            margin: 20px 0;
        }

        /* CONECTORES (LINHAS CINZAS) */
        .match::after {
            content: "";
            position: absolute;
            right: -45px;
            top: 50%;
            width: 45px;
            height: 2px;
            background: var(--border);
        }

        .round-final .match::after {
            display: none;
        }

        /* CAIXAS DOS TIMES */
        .team-card {
            width: 180px;
            height: 48px;
            background-color: var(--bg-card);
            color: var(--text-dark);
            border: 2px solid #000;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            margin: 2px 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .team-card:hover {
            background-color: #e0e0e0;
            transform: translateX(5px);
        }

        .team-card.winner-active {
            background-color: #000;
            color: #fff;
            border-color: #fff;
        }

        /* ÁREA DO CAMPEÃO */
        .champion-podium {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .trophy {
            font-size: 40px;
            filter: grayscale(1);
        }

        #champion-box {
            width: 220px;
            height: 80px;
            background: #fff;
            color: #000;
            border: 6px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 40px rgba(255,255,255,0.05);
        }
    </script>
</body>
</html>
