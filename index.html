<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACKETFLOW | Tournament Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="https://i.postimg.cc/j2R4NRX9/Captura-de-tela-2026-05-08-012138-removebg-preview.png" alt="Logo">
        </div>
        <div class="nav-right">
            <span class="label-ws">WORKSPACE</span>
            <div class="auth-group">
                <button class="btn-auth">LOGIN</button>
                <button class="btn-auth">CADASTRAR</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        
        <aside id="sidebar">
            <div class="sidebar-top">
                <h2>SLOTS</h2>
                <p>Insira os participantes abaixo:</p>
            </div>

            <div class="slots-inputs-wrapper">
                <div class="input-container">
                    <label>SLOT 01</label>
                    <input type="text" class="slot-input" id="in-0" placeholder="Time 1" oninput="updateBracket(0, this.value)">
                </div>
                <div class="input-container">
                    <label>SLOT 02</label>
                    <input type="text" class="slot-input" id="in-1" placeholder="Time 2" oninput="updateBracket(1, this.value)">
                </div>
                <div class="input-container">
                    <label>SLOT 03</label>
                    <input type="text" class="slot-input" id="in-2" placeholder="Time 3" oninput="updateBracket(2, this.value)">
                </div>
                <div class="input-container">
                    <label>SLOT 04</label>
                    <input type="text" class="slot-input" id="in-3" placeholder="Time 4" oninput="updateBracket(3, this.value)">
                </div>
                <div class="input-container">
                    <label>SLOT 05</label>
                    <input type="text" class="slot-input" id="in-4" placeholder="Time 5" oninput="updateBracket(4, this.value)">
                </div>
                <div class="input-container">
                    <label>SLOT 06</label>
                    <input type="text" class="slot-input" id="in-5" placeholder="Time 6" oninput="updateBracket(5, this.value)">
                </div>
                <div class="input-container">
                    <label>SLOT 07</label>
                    <input type="text" class="slot-input" id="in-6" placeholder="Time 7" oninput="updateBracket(6, this.value)">
                </div>
                <div class="input-container">
                    <label>SLOT 08</label>
                    <input type="text" class="slot-input" id="in-7" placeholder="Time 8" oninput="updateBracket(7, this.value)">
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="status-box">
                    <strong>MODO:</strong> ELIMINAÇÃO ÚNICA<br>
                    <strong>STATUS:</strong> EDIÇÃO LIVRE
                </div>
            </div>
        </aside>

        <section id="viewport">
            <div class="zoom-container">
                <div class="bracket-root">
                    
                    <div class="round column-1">
                        <div class="match">
                            <div id="t0" class="team-node" onclick="advance(this, 's0')">---</div>
                            <div id="t1" class="team-node" onclick="advance(this, 's0')">---</div>
                        </div>
                        <div class="match">
                            <div id="t2" class="team-node" onclick="advance(this, 's1')">---</div>
                            <div id="t3" class="team-node" onclick="advance(this, 's1')">---</div>
                        </div>
                        <div class="match">
                            <div id="t4" class="team-node" onclick="advance(this, 's2')">---</div>
                            <div id="t5" class="team-node" onclick="advance(this, 's2')">---</div>
                        </div>
                        <div class="match">
                            <div id="t6" class="team-node" onclick="advance(this, 's3')">---</div>
                            <div id="t7" class="team-node" onclick="advance(this, 's3')">---</div>
                        </div>
                    </div>

                    <div class="round column-2">
                        <div class="match">
                            <div id="s0" class="team-node" onclick="advance(this, 'f0')">?</div>
                            <div id="s1" class="team-node" onclick="advance(this, 'f0')">?</div>
                        </div>
                        <div class="match">
                            <div id="s2" class="team-node" onclick="advance(this, 'f1')">?</div>
                            <div id="s3" class="team-node" onclick="advance(this, 'f1')">?</div>
                        </div>
                    </div>

                    <div class="round column-3">
                        <div class="match">
                            <div id="f0" class="team-node final-box" onclick="advance(this, 'champion-result')">?</div>
                            <div id="f1" class="team-node final-box" onclick="advance(this, 'champion-result')">?</div>
                        </div>
                    </div>

                    <div class="champion-column">
                        <div class="trophy-wrap">🏆</div>
                        <div id="champion-result" class="champion-box">VENCEDOR</div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
